idea:
  title: Do any non-pokemon have non-trivial pokemon quality?
  domain: nlp
  hypothesis: 'The notion of ''X is a pokemon'' is encoded in a large language model,
    possibly as a linear direction in the residual stream or via an MLP. By identifying
    this representation, it is possible to determine which non-pokemon entities are
    closest to being considered pokemon by the model.

    '
  background:
    description: 'How is the notion of ''X'' is a pokemon stored in an LLM? Probably
      via linear direction in the residual stream that checks with an MLP? Whatever
      it is, once we discover it, can we see what things that aren''t pokemon are
      the closest to (in a given LLMs opinion) being pokemon?

      '
